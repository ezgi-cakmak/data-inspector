[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "data-inspector"
version = "0.1.0"
description = "A Python tool for dataset quality checks and exploratory data analysis."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "matplotlib",
]

[project.optional-dependencies]
test = [
    "pytest",
]